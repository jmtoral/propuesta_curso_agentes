<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Cada etapa contiene a la anterior: el prompt vive dentro del contexto, y el contexto dentro del harness">
  <style>
    .t { font: 900 21px "Arial Black", Impact, sans-serif; fill: #111; }
    .y { font: 700 13px "Courier New", monospace; fill: #fffbea; }
    .s { font: 15px Arial, sans-serif; fill: #111; }
    .c { font: 700 14px Arial, sans-serif; fill: #111; }
    .chip { fill: #fff; stroke: #111; stroke-width: 3; }
  </style>
  <rect x="28" y="28" width="860" height="430" fill="#111"/>
  <rect x="20" y="20" width="860" height="430" fill="#ff6b9d" stroke="#111" stroke-width="4"/>
  <text class="t" x="44" y="58">HARNESS ENGINEERING</text>
  <rect x="346" y="40" width="58" height="22" fill="#111"/><text class="y" x="375" y="56" text-anchor="middle">2026</text>
  <text class="s" x="44" y="84">Diseñar el entorno donde el agente trabaja, se equivoca y se corrige.</text>

  <rect x="44" y="104" width="604" height="326" fill="#4cc9f0" stroke="#111" stroke-width="4"/>
  <text class="t" x="66" y="138">CONTEXT ENGINEERING</text>
  <rect x="370" y="120" width="58" height="22" fill="#111"/><text class="y" x="399" y="136" text-anchor="middle">2025</text>
  <text class="s" x="66" y="164">Decidir todo lo que el modelo tiene a la vista.</text>

  <rect x="66" y="190" width="340" height="216" fill="#ffd60a" stroke="#111" stroke-width="4"/>
  <text class="t" x="88" y="226">PROMPT</text>
  <text class="t" x="88" y="252">ENGINEERING</text>
  <rect x="88" y="266" width="104" height="22" fill="#111"/><text class="y" x="140" y="282" text-anchor="middle">2022–2024</text>
  <text class="s" x="88" y="320">Escribir la instrucción</text>
  <text class="s" x="88" y="340">perfecta para obtener</text>
  <text class="s" x="88" y="360">una buena respuesta.</text>

  <rect class="chip" x="426" y="196" width="200" height="34"/><text class="c" x="526" y="218" text-anchor="middle">documentos</text>
  <rect class="chip" x="426" y="242" width="200" height="34"/><text class="c" x="526" y="264" text-anchor="middle">historial de la charla</text>
  <rect class="chip" x="426" y="288" width="200" height="34"/><text class="c" x="526" y="310" text-anchor="middle">resultados de herramientas</text>
  <rect class="chip" x="426" y="334" width="200" height="34"/><text class="c" x="526" y="356" text-anchor="middle">memoria y reglas</text>

  <rect class="chip" x="670" y="104" width="190" height="34"/><text class="c" x="765" y="126" text-anchor="middle">herramientas</text>
  <rect class="chip" x="670" y="150" width="190" height="34"/><text class="c" x="765" y="172" text-anchor="middle">permisos</text>
  <rect class="chip" x="670" y="196" width="190" height="34"/><text class="c" x="765" y="218" text-anchor="middle">CLAUDE.md y skills</text>
  <rect class="chip" x="670" y="242" width="190" height="34"/><text class="c" x="765" y="264" text-anchor="middle">hooks</text>
  <rect class="chip" x="670" y="288" width="190" height="34"/><text class="c" x="765" y="310" text-anchor="middle">subagentes</text>
  <rect class="chip" x="670" y="334" width="190" height="34"/><text class="c" x="765" y="356" text-anchor="middle">pruebas y validadores</text>
  <rect class="chip" x="670" y="380" width="190" height="34"/><text class="c" x="765" y="402" text-anchor="middle">Git para deshacer</text>
</svg>
